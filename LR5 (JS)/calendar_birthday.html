<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дата та Час</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #clock {
            font-size: 2rem;
            margin: 10px;
        }
        .blinking {
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        #calendar {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        table {
            border-collapse: collapse;
            margin-top: 10px;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Цифровий годинник</h2>
    <div id="clock"></div>

    <h2>Таймер зворотного відліку</h2>
    <input type="datetime-local" id="timerInput">
    <button onclick="startCountdown()">Старт</button>
    <div id="countdown"></div>

    <h2>Календар</h2>
    <div id="calendar">
        <input type="month" id="calendarInput" onchange="generateCalendar()">
        <table id="calendarTable"></table>
    </div>

    <h2>Час до дня народження</h2>
    <input type="date" id="birthdayInput">
    <button onclick="calculateBirthdayCountdown()">Порахувати</button>
    <div id="birthdayCountdown"></div>

    <script src="script_calendar.js"></script>

</body>
</html>
