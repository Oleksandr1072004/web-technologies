<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горизонтальний слайдер</title>
    <link rel="stylesheet" href="slider_style.css">
</head>
<body>
    <div class="slider-container">
        <div class="slider">
            <!-- Слайди будуть додані через JavaScript -->
        </div>

        <!-- Навігаційні стрілки -->
        <button class="slider-arrow prev-arrow" aria-label="Попередній слайд">&#10094;</button>
        <button class="slider-arrow next-arrow" aria-label="Наступний слайд">&#10095;</button>

        <!-- Пагінація (крапки) -->
        <div class="slider-pagination"></div>
    </div>

    <script src="slider.js"></script>
</body>
</html>
