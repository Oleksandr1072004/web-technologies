<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форми авторизації та реєстрації</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="login">Увійти</button>
            <button class="tab-btn" data-tab="register">Реєстрація</button>
        </div>

        <!-- Форма авторизації -->
        <form id="login-form" class="form active">
            <div class="form-group">
                <label for="login-username">Ім'я користувача</label>
                <input type="text" id="login-username" placeholder="Введіть ім'я користувача">
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Введіть пароль">
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="error-message"></div>
            </div>

            <div class="form-group remember">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Запам'ятати мене</label>
            </div>

            <button type="submit" class="submit-btn">Увійти</button>
        </form>

        <!-- Форма реєстрації -->
        <form id="register-form" class="form">
            <div class="name-group">
                <div class="form-group">
                    <label for="first-name">Ім'я</label>
                    <input type="text" id="first-name" placeholder="Введіть ім'я">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="last-name">Прізвище</label>
                    <input type="text" id="last-name" placeholder="Введіть прізвище">
                    <div class="error-message"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Введіть email">
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Введіть пароль">
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Підтвердіть пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" placeholder="Підтвердіть пароль">
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="birth-date">Дата народження</label>
                <input type="date" id="birth-date">
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label>Стать</label>
                <div class="radio-group">
                    <div>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Чоловіча</label>
                    </div>
                    <div>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Жіноча</label>
                    </div>
                </div>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="country">Країна</label>
                <select id="country">
                    <option value="">Оберіть країну</option>
                    <option value="ua">Україна</option>
                    <option value="pl">Польща</option>
                    <option value="de">Німеччина</option>
                    <option value="fr">Франція</option>
                </select>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="city">Місто</label>
                <select id="city" disabled>
                    <option value="">Спочатку оберіть країну</option>
                </select>
                <div class="error-message"></div>
            </div>

            <div class="form-group terms">
                <input type="checkbox" id="terms">
                <label for="terms">Я погоджуюсь з умовами використання</label>
                <div class="error-message"></div>
            </div>

            <button type="submit" class="submit-btn">Зареєструватися</button>
        </form>

        <div id="success-message" class="success-message">
            <i class="fas fa-check-circle"></i>
            <p>Реєстрація успішна!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
